<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SimView</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="description" content="Interactive 3D viewer for simulation trajectories." />
    <meta name="theme-color" content="#181825" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181825'/%3E%3Cg stroke='%23181825' stroke-linejoin='round'%3E%3Cpath d='M16 3.5 27.5 10 16 16.5 4.5 10Z' fill='%23b4befe'/%3E%3Cpath d='M4.5 10 16 16.5V29L4.5 22.5Z' fill='%2389b4fa'/%3E%3Cpath d='M16 16.5 27.5 10V22.5L16 29Z' fill='%235e7fc0'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/css/controls.css" />
    <link rel="stylesheet" href="/static/lib/uPlot.min.css" />
  </head>
  <body>
    <div id="container"></div>

    <div id="loading-splash" role="status" aria-live="polite">
      <h1>Loading…</h1>
    </div>

    <!-- three.js, its addons (OrbitControls, lil-gui) and chroma-js are
         vendored locally (same-origin) instead of loaded from a CDN, so the
         viewer keeps working with no internet access. Each library lives in
         a version-stamped directory (e.g. lib/three-0.174.0/) because
         simview/static/lib/ is served with a long-lived, immutable
         Cache-Control header (see _IMMUTABLE_STATIC_DIRS in
         simview/server.py) -- bumping a pinned version must change the URL,
         which a version-stamped directory name gives us for free. Since
         these are now same-origin static files (not a third-party CDN
         response), there is no SRI/integrity concern to guard against. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/static/lib/three-0.174.0/three.module.js",
          "three/addons/": "/static/lib/three-0.174.0/addons/",
          "chroma": "/static/lib/chroma-js-3.1.2/index.min.js"
        }
      }
    </script>

    <script type="module" src="/static/js/main.js"></script>
    <script>
      console.log("SimView index.html loaded");
      window.onerror = function(msg, url, line, col, error) {
        console.error("Global Error:", msg, "at", url, ":", line);
        const splash = document.getElementById("loading-splash");
        if (splash) {
          splash.innerHTML = `<h1 class="sv-splash-error">JavaScript error</h1><p>${msg}</p><p>${url}:${line}</p>`;
        }
      };
    </script>
  </body>
</html>
